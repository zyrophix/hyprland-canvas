# Canvas — Hyprland Infinite Desktop configuration
# Copy to ~/.config/canvas/config.yml and customize

# --- Pan ---
idle_timeout: 0.5             # seconds of gesture silence before pan/edge-scroll stops
pan_step: 100                 # px one pan-left/right/up/down command moves
invert:
  enabled: true               # true = the canvas follows the cursor, false = the other way

# --- Edge-scroll ---
edge_scroll:
  enabled: true               # auto-pan when a dragged window passes the screen edge
  ramp_distance: 50           # px of overflow to reach full speed
  speed: 20.0                 # max px/frame at full overflow (~1200 px/s at 60fps)
  grab_dead_zone: 5           # px the window must move before the camera engages
  # max_speed: 30             # optional: cap the per-frame edge-scroll delta

# --- Navigation ---
navigation:
  cooldown: 0.2               # seconds between navigation commands
  protected_apps:             # windows navigation will not jump to
    - brave-browser
    - chromium
    - chromium-browser
    - google-chrome
    - firefox
    - firefoxdeveloperedition
    - librewolf
    - vivaldi
    - opera
    - microsoft-edge

# --- Windows the camera must leave alone ---
window_pan_excludes: []       # class substrings, case-insensitive; fullscreen,
                              # hidden and pinned windows are always excluded

# --- Canvas mode ---
canvas:
  preserve_geometry: true     # remember where the windows were on canvas OFF and
                              # restore that on the next ON
  auto_float: true            # float and size windows that open while canvas is on
  spawn:
    center: true              # centre them on their monitor
    default: 50%x60%          # px (960x620) or % of the monitor workarea
