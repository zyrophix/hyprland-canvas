[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["canvas"]

[project]
name = "hyprland-canvas"
version = "1.6.0"
description = "Infinite canvas for Hyprland — pan floating windows like an infinite desktop"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
canvasd = "canvas.__main__:daemon_main"
canvas-ctl = "canvas.__main__:ctl_main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=canvas --cov-fail-under=80"

[tool.ruff]
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "C4", "RET", "TC", "ARG"]

[tool.ruff.lint.per-file-ignores]
# Tests use fixtures for their side effects and stubs whose parameters must
# match the signature they stand in for, so an unused argument is not a smell.
"tests/*" = ["ARG001", "ARG002", "ARG005"]

[tool.mypy]
python_version = "3.12"
strict = true

[dependency-groups]
dev = [
    "hypothesis>=6.170.14",
    "mypy>=2.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261030",
]
