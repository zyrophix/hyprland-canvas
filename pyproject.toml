[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["canvas"]

[project]
name = "hyprland-canvas"
version = "1.5.0"
description = "Infinite canvas for Hyprland — pan floating windows like an infinite desktop"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
canvasd = "canvas.__main__:daemon_main"
canvas-ctl = "canvas.__main__:ctl_main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=canvas --cov-fail-under=80"

[tool.ruff]
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.13",
    "types-pyyaml>=6.0.12.20260518",
]
